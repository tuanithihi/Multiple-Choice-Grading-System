[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omr"
version = "0.1.0"
description = "Hệ thống chấm phiếu trả lời trắc nghiệm tự động từ ảnh chụp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
